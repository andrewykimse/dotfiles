# ~/.tmux.conf

# --- Core Settings ---

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Eliminate escape delay (important for vim/neovim)
set -sg escape-time 0

# Send focus events to programs (enables neovim dim on pane switch)
set -g focus-events on

# Bigger scrollback buffer
set -g history-limit 50000

# Set the leader key (prefix) to C-space
# This overrides the default Ctrl+b
set -g prefix C-space
unbind C-b # Unbind the default prefix key

# Set the status bar to appear at the bottom
set -g status-position top 

# Enable mouse support for easier navigation and resizing
set -g mouse on

# Set window and pane indices to start from 1
set -g base-index 1
setw -g pane-base-index 1

# --- Keybindings for Window and Pane Management ---

# Reload tmux config
bind b source-file ~/.config/tmux/tmux.conf \; display "TMUX Config Reloaded!"

# Create new windows in current directory
bind c new-window -c "#{pane_current_path}"

# --- Pane Navigation (vim-tmux-navigator) ---
# Seamless navigation between tmux panes and Neovim splits using Ctrl+h/j/k/l
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Navigate panes using leader + arrow keys (fallback)
bind -r Left  select-pane -L
bind -r Right select-pane -R
bind -r Up    select-pane -U
bind -r Down  select-pane -D


# --- Pane Resizing (leader + r enters resize mode, hjkl to resize, Escape/Enter to exit) ---
bind r switch-client -T resize
bind -T resize h resize-pane -L 5 \; switch-client -T resize
bind -T resize j resize-pane -D 5 \; switch-client -T resize
bind -T resize k resize-pane -U 5 \; switch-client -T resize
bind -T resize l resize-pane -R 5 \; switch-client -T resize
bind -T resize Escape switch-client -T prefix
bind -T resize Enter switch-client -T prefix

# --- Pane Splitting (Unambiguous Keys) ---
# We'll use '%' for vertical splits (left/right) and '"' for horizontal splits (top/bottom).
# These are the default tmux keys for splitting, and are less likely to conflict.

# Vertical split: leader + %
# bind % split-window -h # This is the default, so no need to explicitly bind usually.

# Horizontal split: leader + "
# bind '"' split-window -v # This is the default, so no need to explicitly bind usually.

# If you *really* want to bind them to something else, use keys that don't conflict.
# For example:
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# For this configuration, we'll stick to the default '%' and '"' for splitting.

# --- Initial Layout for Development (Code Editor | Terminal / Claude) ---
# This section defines how your panes are arranged when you first start a session.
# We'll create a vertical split, then a horizontal split in the right pane.

# Bind 'v' to create a vertical split (left/right) in current directory
# bind v split-window -h -c "#{pane_current_path}"

# Bind 'h' to create a horizontal split (top/bottom) in current directory
# bind h split-window -v -c "#{pane_current_path}"

# The actual layout will be achieved by manually executing these splits.
# You can then set a layout if you want a specific initial arrangement.
# For example, to set a default layout:
# select-layout -o main-vertical # This is a predefined layout that is similar

# However, for manual control, we'll rely on the bind commands above.

# --- Hyprland-style Dwindle Splitting ---
# Alternates vertical/horizontal splits based on pane dimensions.
# Factor of 2 accounts for terminal cells being ~2x taller than wide.
bind Enter run-shell '\
  w=$(tmux display-message -p "#{pane_width}"); \
  h=$(tmux display-message -p "#{pane_height}"); \
  p=$(tmux display-message -p "#{pane_current_path}"); \
  if [ $w -gt $((h * 2)) ]; then \
    tmux split-window -h -c "$p"; \
  else \
    tmux split-window -v -c "$p"; \
  fi'

# --- Copy Mode (vim-style) ---
setw -g mode-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel

# --- Status Bar Configuration ---
set -g status-bg colour235 # Dark grey background
set -g status-fg colour137 # Light yellow foreground
# set -g status-left-bg colour234 # Slightly darker grey for left status
# set -g status-left-fg colour160 # Red for left status

# Format for the left side of the status bar (session name + copy mode indicator)
set -g status-left-length 50
set -g status-left '#{?pane_in_mode,#[fg=colour208]#[bold]#[fg=colour231] COPY #[fg=colour208]#[normal] ,#[fg=colour160]#[bold]#[fg=colour231] #S #[fg=colour160]#[normal]}'

# Format for the right side of the status bar (time and date)
set -g status-right '#[fg=colour137]#[bold] %a, %d %b %Y %H:%M:%S #[fg=colour137]#[normal]'

# Highlight the current window
setw -g window-status-current-style 'fg=colour231,bg=colour238,bold'
setw -g window-status-current-format '#[fg=colour231,bg=colour238,bold] #I:#W #[fg=colour231,bg=colour238,bold]'

# Style for inactive windows
setw -g window-status-style 'fg=colour244,bg=colour235'
setw -g window-status-format '#[fg=colour244,bg=colour235] #I:#W #[fg=colour244,bg=colour235]'

# Pane highlighting (dim inactive panes, full brightness for active)
set -g window-style 'fg=colour242,bg=colour235'
set -g window-active-style 'fg=colour255,bg=colour0'

# Border style
set -g pane-border-lines heavy
set -g pane-border-indicators both
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour160'

# Find keywords in all files in the current directory and subdirectories (opens in NEW window)
bind / command-prompt "pipe-pane 'rg --color=always --line-number --no-heading --smart-case \"%%\" | fzf --ansi --delimiter ':' --nth 1,2 --header \"Search results\" --preview '' --bind \"enter:execute-silent(tmux new-window -n '{2}:{1}' \\\"vim +{2} {1}\\\")\" '"
# --- FZF Session/Window/Pane Switcher ---
# prefix + f: fuzzy-find across all sessions and windows in a popup
bind f display-popup -E -w 60% -h 60% "\
  (tmux list-sessions -F 'session|#{session_name}|#{session_name} (#{session_windows} win)'; \
   tmux list-windows -a -F 'window|#{session_name}:#{window_index}|#{session_name}:#{window_index} #{window_name} [#{pane_current_command}] #{pane_current_path}') | \
  awk -F'|' '{print \$3 \"\t\" \$2}' | \
  fzf --reverse --header='Switch to:' --with-nth=1 --delimiter='\t' \
    --preview='tmux capture-pane -ep -t {2} 2>/dev/null' \
    --preview-window=right:50% | \
  awk -F'\t' '{print \$2}' | \
  xargs -r tmux switch-client -t"

# --- Optional: Auto-rename windows ---
# set -g set-titles on
# set -g set-titles-string '#S:#I:#W'

